  <text x="450" y="262" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#1E3A8A">MQTT Broker</text>
  <text x="450" y="284" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#1E3A8A">EMQX / ThingsBoard MQTT</text>

  <line x1="450" y1="320" x2="450" y2="380" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)"/>

