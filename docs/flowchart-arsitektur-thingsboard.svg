  </defs>

  <rect width="900" height="820" fill="#FFFFFF"/>

  <text x="450" y="40" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Arsitektur Transport IoT — SPPG MBG (SFT 2026)</text>

  <rect x="120" y="70" width="300" height="90" rx="12" fill="#FFF3CD" stroke="#D97706" stroke-width="2"/>
  <text x="270" y="100" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#92400E">ESP32-CAM (AI)</text>
  <text x="270" y="122" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#92400E">Foto sisa makanan</text>
  <text x="270" y="142" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#92400E">+ klasifikasi AI</text>

  <rect x="480" y="70" width="300" height="90" rx="12" fill="#FFF3CD" stroke="#D97706" stroke-width="2"/>
  <text x="630" y="100" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#92400E">ESP32 Load Cell (IoT)</text>
  <text x="630" y="122" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#92400E">Timbang sisa makanan</text>
  <text x="630" y="142" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#92400E">(berat dalam kg)</text>

