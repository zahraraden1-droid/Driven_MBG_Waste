  <text x="450" y="806" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#475569">Catatan: foto (JPEG binary) tidak masuk telemetri JSON ThingsBoard — lewat Backend Express → Roboflow. Gunakan satu sumber data utama (Supabase).</text>
