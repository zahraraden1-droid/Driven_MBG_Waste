  <text x="450" y="604" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#166534">waste_records · sensor_readings</text>
  <text x="450" y="624" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#166534">maggot_batches · sales_records</text>

