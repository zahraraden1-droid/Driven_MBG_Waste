  <text x="450" y="434" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#4338CA">Proses Roboflow + evaluasi sensor</text>
  <text x="450" y="454" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#4338CA">Rekomendasi: Backend Express sebagai otak utama</text>
  <text x="450" y="474" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#4338CA">ThingsBoard Engine opsional (untuk dashboard)</text>

